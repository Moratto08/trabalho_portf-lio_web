        <section id="media">
            <h2>Implementação de Media Queries</h2>

            <p>
                Media Queries são usadas para deixar o site responsivo
                em diferentes tamanhos de tela.
            </p>

            <h3>Exemplo:</h3>

            <pre>
@media (max-width: 768px) {
  body {
